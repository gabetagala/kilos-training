<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F2" />
  <title>Tomato Cam</title>
  <link rel="stylesheet" href="/family.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Tokens come from /family.css — these are the local aliases the rest of
       this page already uses. */
    :root {
      --card: var(--surface); --soft: var(--ink-2); --leaf: var(--green);
      --cream: var(--surface-2);
      --shadow: 0 2px 6px rgba(26,43,34,.05), 0 18px 44px rgba(26,43,34,.10);
    }
    body {
      background: var(--bg); color: var(--ink); min-height: 100dvh;
      font-family: var(--font-ui);
      display: flex; flex-direction: column; gap: 16px; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }

    /* poster hero: cropped giant tomato + chunky serif, like the refs */
    .hero {
      position: relative; overflow: hidden; border-radius: 28px;
      background: var(--bg); min-height: 190px; padding: 26px 22px 22px;
      display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    }
    .hero .t.big {
      position: absolute; top: -68px; right: -52px; width: 250px; height: 250px;
      transform: rotate(8deg); z-index: 0;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: 52px; font-weight: 600; line-height: .95; letter-spacing: -.03em;
      position: relative; z-index: 2; color: var(--ink);
    }
    /* z-index so the poster tomato never paints over the words. */
    .hero .tag { color: var(--ink-2); font-size: 15px; line-height: 1.5;
      position: relative; z-index: 2; max-width: 22ch; }

    a.role {
      display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-lg); overflow: hidden;
      text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
    }
    .art { height: 118px; position: relative; overflow: hidden; }
    .art.baby { background: var(--cream); }
    .art.me { background: var(--green-soft); }
    .art .t { position: absolute; }
    .art span {
      position: absolute; left: 12px; bottom: 12px; z-index: 2;
      background: rgba(255, 255, 255, .84); -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--line);
      padding: 9px 15px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 650;
      letter-spacing: -.012em; color: var(--ink);
    }
    .role p { padding: 15px 18px 18px; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
    .foot { text-align: center; color: var(--ink-3); font-size: 12.5px; line-height: 1.5; }
    .t { display: block; }
  </style>
</head>
<body class="grain">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute;">
    <defs>
      <g id="tom">
        <g fill="#3A7D44">
          <path d="M50 42 C46 26 46 12 50 2 C54 12 54 26 50 42Z" transform="rotate(-52 50 42)" />
          <path d="M50 42 C46 26 46 12 50 2 C54 12 54 26 50 42Z" transform="rotate(-26 50 42)" />
          <path d="M50 42 C46 26 46 12 50 2 C54 12 54 26 50 42Z" />
          <path d="M50 42 C46 26 46 12 50 2 C54 12 54 26 50 42Z" transform="rotate(26 50 42)" />
          <path d="M50 42 C46 26 46 12 50 2 C54 12 54 26 50 42Z" transform="rotate(52 50 42)" />
        </g>
        <ellipse cx="50" cy="61" rx="42" ry="37" fill="#E23A1E" />
      </g>
    </defs>
  </svg>

  <section class="hero grain">
    <svg class="t big" viewBox="0 0 100 100"><use href="#tom" /></svg>
    <h1>tomato<br />cam</h1>
    <p class="tag">Never wonder if the silence is normal.</p>
  </section>

  <a class="role" href="/tomato/cam.html">
    <div class="art baby grain">
      <svg class="t" viewBox="0 0 100 100" style="width: 92px; top: 8px; left: 34%; transform: rotate(-10deg);"><use href="#tom" /></svg>
      <svg class="t" viewBox="0 0 100 100" style="width: 64px; top: 44px; right: 14%; transform: rotate(14deg);"><use href="#tom" /></svg>
      <svg class="t" viewBox="0 0 100 100" style="width: 46px; top: -10px; right: 32%; transform: rotate(-24deg);"><use href="#tom" /></svg>
      <span>Baby's room</span>
    </div>
    <p>This phone stays with baby — camera and mic on, plugged in, screen stays on.</p>
  </a>

  <a class="role" href="/tomato/view.html">
    <div class="art me grain">
      <svg class="t" viewBox="0 0 100 100" style="width: 110px; top: 14px; right: 8%; transform: rotate(6deg);"><use href="#tom" /></svg>
      <svg class="t" viewBox="0 0 100 100" style="width: 52px; top: 52px; left: 30%; transform: rotate(-16deg);"><use href="#tom" /></svg>
      <span>With me</span>
    </div>
    <p>Watch and listen on this phone. It will warn you if the stream stops.</p>
  </a>

  <p class="foot">Video stays on your home Wi-Fi — nothing is uploaded or recorded.</p>
</body>
</html>
