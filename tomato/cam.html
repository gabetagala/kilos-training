<!doctype html>
<html lang="en" class="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12130f" />
  <title>Tomato Cam: Baby's room</title>
  <meta name="color-scheme" content="dark" />
  <link rel="apple-touch-icon" href="/tomatito-icon-180.png" />
  <link rel="stylesheet" href="/family.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Baby unit. Looked at once, while you prop the phone up: the preview to
       aim it, the code to pair it, one line saying it worked. Then black. */
    :root { --ok: var(--green-2); --bad: var(--tomato-lift); }
    body {
      background: var(--bg); color: var(--ink); min-height: 100dvh;
      font-family: var(--font-ui);
      display: flex; flex-direction: column; gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    header { display: flex; align-items: center; padding: 0 4px; }
    header .famhead { --mark: 19px; }

    /* The preview fills the screen and everything you need sits ON it, so
       nothing is ever below the fold on a phone with Safari's bars showing. */
    #stage {
      position: relative; border-radius: var(--r-md); overflow: hidden; background: var(--surface);
      flex: 1; min-height: 300px;
    }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .chip {
      position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px;
      background: var(--scrim); color: var(--on-scrim);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      padding: 7px 11px; border-radius: 999px; font-size: 13px; font-weight: 600;
    }
    #chipbar { width: 40px; height: 5px; border-radius: 3px; background: var(--scrim-line); overflow: hidden; }
    #meterfill { display: block; height: 100%; width: 0%; background: var(--ok); transition: width 120ms linear; }

    #panel {
      position: absolute; left: 10px; right: 10px; bottom: 10px;
      background: var(--scrim-strong); color: var(--on-scrim);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-radius: var(--r-md); padding: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    }
    #p-code[hidden], #p-msg[hidden], #start[hidden] { display: none; }
    #p-code { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .plabel { font-size: 15px; font-weight: 700; }
    .codebits { display: flex; gap: 6px; }
    .codebits span {
      width: 44px; height: 56px; border-radius: var(--r-xs); background: var(--surface-2);
      color: var(--ink); font-size: 28px; font-weight: 800;
      display: grid; place-items: center; font-variant-numeric: tabular-nums;
    }
    .ptip { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
    .ptip.warn, #p-msg.warn { color: var(--bad); font-weight: 700; }
    #p-msg { font-size: 17px; font-weight: 800; }
    #p-msg.ok { color: var(--ok); }

    .primary {
      font: inherit; font-size: 17px; font-weight: 800; min-height: 56px; width: 100%;
      background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
    }
    #cfg { color: var(--bad); font-size: 13px; text-align: center; }

    /* Dimmed: the whole page goes black (OLED, so the pixels are off) while
       capture keeps running underneath. A tap brings it back. */
    #night {
      position: fixed; inset: 0; z-index: 50; background: var(--ns-bg);
      display: none; place-items: center; text-align: center;
    }
    #night.on { display: grid; }
    #night p { color: var(--ns-dim); font-size: 14px; line-height: 2; }
  </style>
</head>
<body>
  <header>
    <a class="famhead" href="/tomato/" aria-label="Back to Tomato Cam, pick a phone"><i class="tomatomark"></i><span class="set">Tomato</span><span class="app">Cam</span></a>
  </header>

  <div id="stage">
    <video id="preview" autoplay playsinline muted></video>
    <div class="chip"><span>Sound</span><span id="chipbar"><i id="meterfill"></i></span></div>
    <section id="panel">
      <div id="p-code">
        <p class="plabel">Type this code on your phone</p>
        <div class="codebits" id="codebits">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="ptip" id="p-tip">Keep this phone plugged in, and set Auto-Lock to Never.</p>
      </div>
      <p id="p-msg" hidden></p>
      <button id="start" class="primary" hidden>Start camera</button>
    </section>
  </div>

  <button id="update" class="updbtn" type="button"></button>
  <p id="cfg" hidden>App config missing, so this build can't connect. Check the deploy.</p>

  <div id="night" aria-label="Screen dimmed. Tap to check.">
    <p id="nighttext">Tomato Cam is on<br />Tap to check</p>
  </div>

  <script type="module" src="./src/cam.js"></script>
</body>
</html>
