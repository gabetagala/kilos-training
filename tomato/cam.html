<!doctype html>
<html lang="en" class="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12130f" />
  <title>Tomato Cam · Baby's room</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-title" content="Cam" />
  <link rel="stylesheet" href="/family.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Baby unit: dark family of the viewer's ivory. Big bright-enough
       preview for positioning; "Dim for the night" hides everything under
       a near-black overlay so the screen doesn't glow (SCOPE §3.9). */
    :root {
      /* .night on <html> supplies the palette from /family.css. */
      --card: var(--surface); --soft: var(--ink-2);
      --ok: var(--green); --bad: var(--tomato);
    }
    body {
      background: var(--bg); color: var(--ink); min-height: 100dvh;
      font-family: var(--font-ui);
      display: flex; flex-direction: column; gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
    header .famhead { --mark: 19px; }
    .pillbtn {
      font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 9px 15px; min-height: 44px;
    }

    /* full-fold positioning preview with overlay chips, mirrors the viewer */
    #stage {
      position: relative; border-radius: var(--r-md); overflow: hidden; background: var(--bg);
      height: calc(100dvh - 116px); min-height: 300px; flex-shrink: 0;
    }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .chip {
      position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px;
      background: var(--scrim); color: var(--on-scrim);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      padding: 7px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    }
    #chipbar { width: 40px; height: 5px; border-radius: 3px; background: var(--scrim-line); overflow: hidden; }
    #meterfill { display: block; height: 100%; width: 0%; background: var(--ok); transition: width 120ms linear; }

    .card { background: var(--card); border-radius: 18px; padding: 14px 16px; }

    .codebox { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 16px; }
    .codebits { display: flex; gap: 6px; }
    .codebits span {
      width: 44px; height: 54px; border-radius: var(--r-xs); background: var(--surface-2);
      color: var(--ink); font-size: 24px; font-weight: 800;
      display: grid; place-items: center;
    }
    .ghost { font: inherit; font-size: 13px; color: var(--soft); background: none; border: 0; text-decoration: underline; padding: 8px; min-height: 44px; }



    .primary {
      font: inherit; font-size: 17px; font-weight: 800; min-height: 58px;
      background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
    }
    .meta { text-align: center; color: var(--soft); font-size: 12px; line-height: 1.8; }
    #cfg { color: var(--bad); font-size: 13px; text-align: center; }

    /* night mode: the whole page goes near-black; capture keeps running */
    #night {
      position: fixed; inset: 0; z-index: 50; background: var(--ns-bg);
      display: none; place-items: center; text-align: center;
    }
    #night.on { display: grid; }
    #night p { color: var(--ns-dim); font-size: 13px; line-height: 2; }
  </style>
</head>
<body>
  <header>
    <a class="famhead" href="/tomato/" aria-label="Back to Tomato Cam, pick a phone"><i class="tomatomark"></i><span class="set">Tomatito</span><span class="app">Cam</span></a>
  </header>

  <div id="stage">
    <video id="preview" autoplay playsinline muted></video>
    <div class="chip"><span>Sound</span><span id="chipbar"><i id="meterfill"></i></span></div>
  </div>

  <section class="card codebox">
    <span class="rowlbl">Connect code — enter this on your phone</span>
    <div class="codebits" id="codebits">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <button id="newcode" class="ghost">New code</button>
  </section>

  <button id="start" class="primary" hidden>Start camera</button>
  <button class="fambuild" data-update type="button">checking for an update</button>
  <span class="fambuild-note">video stays on your home Wi-Fi</span>
  <p id="cfg" hidden>App config missing — this build can't connect. Tap Update, or check the deploy.</p>

  <div id="night" aria-label="Night mode — tap to show controls">
    <p>Bantay is watching<br />tap anywhere to check</p>
  </div>

  <script type="module" src="./src/cam.js"></script>
</body>
</html>
